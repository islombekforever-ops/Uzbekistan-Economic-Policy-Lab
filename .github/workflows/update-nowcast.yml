name: Run DFM Model & Update Nowcast Data

on:
  # Run on the 5th of every month at 09:00 UTC (after data releases)
  schedule:
    - cron: "0 9 5 * *"
  # Also allow manual trigger
  workflow_dispatch:

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}-v1

      - name: Install R packages
        run: |
          Rscript -e "
            pkgs <- c('dplyr','tidyr','zoo','purrr','readxl','lubridate',
                      'urca','seasonal','Matrix','pracma','signal',
                      'rmarkdown','ggplot2','jsonlite')
            install.packages(pkgs, repos='https://cloud.r-project.org', quiet=TRUE)
          "

      - name: Run DFM model & export JSON
        run: Rscript export_results.R

      - name: Commit updated nowcast data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add platform/public/data/nowcast.json
          git diff --staged --quiet || git commit -m "chore: update nowcast data [skip ci]"
          git push
